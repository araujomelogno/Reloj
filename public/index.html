<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipos Consultores — Fichaje de Encuestadores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- SheetJS para exportar a Excel (.xlsx). Se carga desde CDN. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- ══════════════════════════════════════════════════════════════════
       CONFIGURACIÓN DE FIREBASE
       Reemplazá el objeto de abajo por la config de TU proyecto Firebase
       (Consola Firebase → Configuración del proyecto → Tus apps → Web).
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
    window.firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };
    // Zona horaria de referencia para fechas y horas (Uruguay).
    window.APP_TZ = "America/Montevideo";
    // Colección que usa la extensión "Trigger Email from Firestore".
    // Si instalaste la extensión con otro nombre de colección, cambialo acá.
    window.MAIL_COLLECTION = "mail";
  </script>

  <style>
    /* ── Brand tokens (marca Equipos Consultores) ── */
    :root {
      --orange:       #E96436;
      --orange-dark:  #C8512A;
      --orange-light: #FDF0EB;
      --dark:         #3A3838;
      --dark2:        #222222;
      --gray:         #7A7A7A;
      --gray-light:   #EEEEEE;
      --gray-xlight:  #F7F7F7;
      --white:        #FFFFFF;
      --border:       #E2E2E2;
      --green:        #1E9E57;
      --green-light:  #E8F6EE;
      --red:          #B83A26;
      --red-light:    #FEF0EF;
      --amber:        #B7791F;
      --amber-light:  #FBF3E3;
      --blue:         #3A6EA5;
      --blue-light:   #EAF1F8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-xlight);
      color: var(--dark2);
      line-height: 1.55;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.02em; color: var(--dark); }

    /* ══ LOGO ══ */
    .logo-horizontal-white { height: 46px; width: auto; display: block; }

    /* ══ LOGIN ══ */
    .login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .login-brand {
      background: var(--dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3rem; position: relative; overflow: hidden;
    }
    .login-brand::before {
      content: ''; position: absolute; bottom: 8%; left: -30px;
      width: 140px; height: 140px; background: var(--orange); opacity: 0.9;
    }
    .login-brand::after {
      content: ''; position: absolute; top: 10%; right: -20px;
      width: 80px; height: 80px; background: var(--orange); opacity: 0.18;
    }
    .login-brand-inner { position: relative; z-index: 1; text-align: center; max-width: 360px; }
    .login-brand-logo { margin-bottom: 2rem; }
    .login-brand-logo img { height: 110px; width: auto; margin: 0 auto; display: block; }
    .login-brand .tagline { font-size: 1.75rem; font-weight: 800; color: var(--white); letter-spacing: -0.025em; line-height: 1.15; }
    .login-brand .tagline em { color: var(--orange); font-style: normal; display: block; }
    .login-brand .tagline-sub { margin-top: 1.5rem; font-size: 0.82rem; color: rgba(255,255,255,0.55); font-weight: 500; letter-spacing: 0.02em; }

    .login-form-panel { background: var(--white); display: flex; align-items: center; justify-content: center; padding: 3rem; }
    .login-form-inner { width: 100%; max-width: 380px; }
    .login-form-inner h1 { font-size: 1.7rem; font-weight: 800; color: var(--dark); letter-spacing: -0.03em; margin-bottom: 0.35rem; }
    .login-sub { font-size: 0.85rem; color: var(--gray); margin-bottom: 2rem; font-weight: 500; }
    .login-forgot { margin-top: 1rem; text-align: center; }
    .login-forgot a { font-size: 0.82rem; font-weight: 600; color: var(--orange); text-decoration: none; cursor: pointer; }
    .login-forgot a:hover { text-decoration: underline; }
    @media (max-width: 780px) { .login-wrap { grid-template-columns: 1fr; } .login-brand { display: none; } }

    /* ══ FORM ══ */
    label { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dark); margin-bottom: 0.5rem; }
    input[type=email], input[type=password], input[type=text], input[type=date], input[type=time], input[type=number], select.fselect, textarea.finput {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border); border-radius: 3px;
      font-family: 'Montserrat', sans-serif; font-size: 0.9rem; font-weight: 500; color: var(--dark2);
      background: var(--white); outline: none; transition: all 0.2s;
    }
    input:focus, select.fselect:focus, textarea.finput:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(233,100,54,0.12); }
    textarea.finput { resize: vertical; min-height: 68px; }
    .form-group { margin-bottom: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    .field-hint { font-size: 0.72rem; color: var(--gray); font-weight: 500; margin-top: 0.35rem; }

    /* ══ BUTTONS ══ */
    button { cursor: pointer; font-family: 'Montserrat', sans-serif; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.7rem 1.3rem; border-radius: 3px; border: none; font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; transition: all 0.18s; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn-orange { background: var(--orange); color: var(--white); }
    .btn-orange:not(:disabled):hover { background: var(--orange-dark); transform: translateY(-1px); box-shadow: 0 5px 16px rgba(233,100,54,0.35); }
    .btn-dark { background: var(--dark); color: var(--white); }
    .btn-dark:not(:disabled):hover { background: var(--dark2); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--dark); }
    .btn-outline:not(:disabled):hover { border-color: var(--orange); color: var(--orange); }
    .btn-green { background: var(--green); color: var(--white); }
    .btn-green:not(:disabled):hover { background: #17824A; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(30,158,87,0.3); }
    .btn-danger { background: var(--red); color: var(--white); }
    .btn-danger:not(:disabled):hover { background: #962E1E; }
    .btn-sm { padding: 0.42rem 0.85rem; font-size: 0.7rem; }
    .btn-full { width: 100%; padding: 0.9rem; font-size: 0.82rem; }

    /* ══ APP LAYOUT (coordinadora) ══ */
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; flex-shrink: 0; background: var(--dark); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
    .sidebar-top { padding: 1.5rem 1.2rem 1.3rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-section-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.32); padding: 1.1rem 1.2rem 0.5rem; }
    .nav-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.75rem 1.2rem; width: 100%; text-align: left; border: none; background: none;
      font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.02em; color: rgba(255,255,255,0.6); transition: all 0.15s; cursor: pointer; }
    .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.05); }
    .nav-item.active { color: var(--white); background: var(--orange); font-weight: 700; }
    .nav-item .nav-icon { font-size: 1rem; width: 20px; text-align: center; opacity: 0.9; }
    .sidebar-footer { margin-top: auto; padding: 1rem 1.2rem 1.2rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .user-pill { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.9rem; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--orange); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; flex-shrink: 0; }
    .user-info-wrap { overflow: hidden; min-width: 0; }
    .user-email { font-size: 0.74rem; font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.62rem; color: rgba(255,255,255,0.4); margin-top: 2px; letter-spacing: 0.03em; }
    .main { margin-left: 240px; flex: 1; padding: 2.25rem 2.5rem; min-width: 0; }
    @media (max-width: 860px) {
      .sidebar { position: static; width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
      .sidebar-top { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .sidebar-section-label { display: none; }
      .nav-item { width: auto; }
      .sidebar-footer { margin-left: auto; border: none; }
      .user-pill { margin-bottom: 0; }
      .main { margin-left: 0; padding: 1.5rem 1.15rem; }
    }

    /* ══ PAGE HEADER ══ */
    .page-header { margin-bottom: 2rem; }
    .accent-bar { height: 4px; width: 44px; background: var(--orange); margin-bottom: 1rem; }
    .page-header h2 { font-size: 1.5rem; font-weight: 800; color: var(--dark); letter-spacing: -0.025em; margin-bottom: 0.2rem; }
    .page-header h2 .accent { color: var(--orange); }
    .page-header p { font-size: 0.85rem; color: var(--gray); font-weight: 500; }
    .header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

    /* ══ CARDS ══ */
    .card { background: var(--white); border-radius: 4px; border: 1px solid var(--border); }
    .card + .card { margin-top: 1.25rem; }
    .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .card-header-title { font-size: 0.8rem; font-weight: 700; color: var(--dark); letter-spacing: 0.04em; text-transform: uppercase; }
    .card-body { padding: 1.5rem; }
    .card-body.tight { padding: 0; }

    /* ══ TABLE ══ */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.68rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em; padding: 0.75rem 1.5rem; background: var(--gray-xlight); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 0.84rem; vertical-align: middle; font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #FAFAFA; }
    .td-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .td-strong { font-weight: 700; color: var(--dark); }
    .td-muted { color: var(--gray); }
    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--gray); font-weight: 500; font-size: 0.88rem; }
    .empty-state .ei { font-size: 2.2rem; display: block; margin-bottom: 0.6rem; }

    /* ══ STAT TILES ══ */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 1.15rem 1.25rem; position: relative; overflow: hidden; }
    .stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gray-light); }
    .stat.s-total::before { background: var(--dark); }
    .stat.s-ok::before { background: var(--green); }
    .stat.s-bad::before { background: var(--red); }
    .stat.s-warn::before { background: var(--amber); }
    .stat.s-free::before { background: var(--blue); }
    .stat .stat-num { font-size: 1.9rem; font-weight: 800; color: var(--dark); letter-spacing: -0.03em; line-height: 1; }
    .stat .stat-label { font-size: 0.68rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 0.4rem; }

    /* ══ BADGES / ESTADOS ══ */
    .badge { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 3px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .badge-admin { background: var(--orange); color: var(--white); }
    .badge-user { background: var(--gray-light); color: var(--gray); }
    .badge-on { background: var(--green-light); color: var(--green); }
    .badge-off { background: var(--gray-light); color: var(--gray); }
    .est { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
    .est::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .est-completa { background: var(--green-light); color: var(--green); }
    .est-no_ficho { background: var(--red-light); color: var(--red); }
    .est-sin_salida { background: var(--amber-light); color: var(--amber); }
    .est-dia_libre { background: var(--blue-light); color: var(--blue); }
    .est-no_correspondia { background: var(--gray-light); color: var(--gray); }
    .est-inactivo { background: var(--gray-light); color: var(--gray); }
    .est-en_curso { background: var(--orange-light); color: var(--orange-dark); }

    /* ══ ALERTS ══ */
    .alert { padding: 0.8rem 1rem; border-radius: 3px; font-size: 0.82rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .alert-error { background: var(--red-light); color: #8B1A0A; border-left: 3px solid var(--red); }
    .alert-success { background: var(--green-light); color: #14663A; border-left: 3px solid var(--green); }
    .alert-info { background: var(--blue-light); color: #2A527A; border-left: 3px solid var(--blue); }
    .alert-warn { background: var(--amber-light); color: #7A5310; border-left: 3px solid var(--amber); }

    /* ══ CHIPS / WEEKDAY SELECTOR ══ */
    .seg { display: inline-flex; flex-wrap: wrap; gap: 0.35rem; }
    .seg label { display: inline-flex; align-items: center; justify-content: center; margin: 0; padding: 0.4rem 0.7rem; border: 1.5px solid var(--border); border-radius: 3px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; text-transform: none; color: var(--gray); cursor: pointer; user-select: none; transition: all 0.15s; }
    .seg input { position: absolute; opacity: 0; width: 0; height: 0; }
    .seg input:checked + span, .seg label.on { color: var(--white); }
    .seg label:has(input:checked) { background: var(--orange); border-color: var(--orange); color: var(--white); }
    .toolbar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .date-nav { display: inline-flex; align-items: center; gap: 0.5rem; }
    .date-nav .cur { font-size: 0.9rem; font-weight: 700; color: var(--dark); min-width: 210px; text-align: center; }
    .date-nav .cur::first-letter { text-transform: uppercase; }

    /* ══ ENCUESTADOR (fichaje) LAYOUT ══ */
    .topbar { background: var(--dark); padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; position: relative; overflow: hidden; }
    .topbar::after { content: ''; position: absolute; top: -30px; right: 8%; width: 90px; height: 90px; background: var(--orange); opacity: 0.14; }
    .topbar .tb-user { display: flex; align-items: center; gap: 0.7rem; position: relative; z-index: 1; }
    .topbar .tb-user .user-avatar { width: 34px; height: 34px; font-size: 0.82rem; }
    .topbar .tb-name { font-size: 0.82rem; font-weight: 700; color: var(--white); }
    .topbar .tb-role { font-size: 0.62rem; color: rgba(255,255,255,0.45); letter-spacing: 0.04em; text-transform: uppercase; }
    .ficha-wrap { max-width: 640px; margin: 2.5rem auto; padding: 0 1.15rem 3rem; }
    .clock-hero { background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 2.25rem 2rem; text-align: center; position: relative; overflow: hidden; }
    .clock-hero .accent-bar { margin: 0 auto 1.1rem; }
    .clock-hero .greet { font-size: 0.8rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em; }
    .clock-hero .today-date { font-size: 1.35rem; font-weight: 800; color: var(--dark); letter-spacing: -0.02em; margin: 0.25rem 0 0.15rem; }
    .clock-hero .today-date::first-letter { text-transform: uppercase; }
    .clock-live { font-size: 3.1rem; font-weight: 800; color: var(--orange); letter-spacing: -0.03em; line-height: 1; margin: 1rem 0 0.4rem; font-variant-numeric: tabular-nums; }
    .status-line { font-size: 0.92rem; font-weight: 600; color: var(--dark2); margin-top: 0.4rem; }
    .status-line strong { color: var(--orange-dark); }
    .big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.75rem; }
    @media (max-width: 520px) { .big-actions { grid-template-columns: 1fr; } }
    .big-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem; padding: 1.5rem 1rem; border-radius: 6px; border: none;
      font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.18s; color: var(--white); }
    .big-btn .bi { font-size: 1.8rem; }
    .big-btn-in { background: var(--green); }
    .big-btn-in:not(:disabled):hover { background: #17824A; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(30,158,87,0.32); }
    .big-btn-out { background: var(--orange); }
    .big-btn-out:not(:disabled):hover { background: var(--orange-dark); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(233,100,54,0.32); }
    .big-btn:disabled { background: var(--gray-light); color: #B5B5B5; cursor: not-allowed; }
    .ficha-note { margin-top: 1.15rem; font-size: 0.76rem; color: var(--gray); font-weight: 500; }
    .hist-times { display: inline-flex; gap: 0.9rem; align-items: center; }
    .hist-times .t { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--dark); }

    /* ══ MODAL ══ */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(58,56,56,0.6); z-index: 150; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-box { background: var(--white); border-radius: 6px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--white); z-index: 2; }
    .modal-title { font-size: 0.95rem; font-weight: 800; color: var(--dark); word-break: break-word; }
    .modal-close { border: none; background: none; font-size: 1.3rem; color: var(--gray); line-height: 1; padding: 0.2rem 0.4rem; }
    .modal-close:hover { color: var(--dark); }
    .modal-body { padding: 1.25rem; }
    .modal-foot { padding: 1rem 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.6rem; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--white); }

    /* ══ PICK LIST (encuestadores en días libres) ══ */
    .pick-list { max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; }
    .pick { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.8rem; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .pick:last-child { border-bottom: none; }
    .pick:hover { background: #faf7f5; }
    .pick input { width: 16px; height: 16px; accent-color: var(--orange); flex: 0 0 auto; }
    .pick-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; flex: 0 0 auto; }
    .pick-name { font-size: 0.84rem; font-weight: 600; color: var(--dark); }
    .pick-email { font-size: 0.72rem; color: var(--gray); }

    /* ══ TOAST ══ */
    #toast-wrap { position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 300; display: flex; flex-direction: column; gap: 0.6rem; max-width: 360px; }
    .toast { background: var(--dark); color: var(--white); padding: 0.85rem 1.1rem; border-radius: 4px; font-size: 0.82rem; font-weight: 600; box-shadow: 0 8px 26px rgba(0,0,0,0.28);
      display: flex; align-items: center; gap: 0.6rem; border-left: 4px solid var(--orange); animation: toast-in 0.22s ease; }
    .toast.ok { border-left-color: var(--green); }
    .toast.err { border-left-color: var(--red); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ══ MISC ══ */
    .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .info-card { background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 2.5rem; max-width: 440px; text-align: center; }
    .info-card .ic-icon { font-size: 2.6rem; margin-bottom: 0.8rem; }
    .info-card h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .info-card p { font-size: 0.88rem; color: var(--gray); font-weight: 500; margin-bottom: 1.5rem; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--gray-light); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mono { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .nowrap { white-space: nowrap; }
    .config-banner { background: #FFF6E9; border: 1px solid #F0D9A8; color: #8A5A00; padding: 0.7rem 1rem; font-size: 0.8rem; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <div id="app">
    <div class="center-screen"><div class="spinner"></div></div>
  </div>
  <div id="toast-wrap"></div>

  <script type="module">
    import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
      sendPasswordResetEmail, createUserWithEmailAndPassword
    } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import {
      getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
      query, where, orderBy, serverTimestamp, writeBatch
    } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    // ════════════════════════════════════════════════════════════════
    //  Estado global
    // ════════════════════════════════════════════════════════════════
    const TZ = window.APP_TZ || 'America/Montevideo';
    const MAIL_COLLECTION = window.MAIL_COLLECTION || 'mail';
    const cfg = window.firebaseConfig || {};
    const CONFIG_OK = cfg.apiKey && cfg.apiKey !== 'TU_API_KEY' && cfg.projectId && cfg.projectId !== 'TU_PROYECTO';

    let app, auth, db;
    const S = { user: null, me: null };          // user = Firebase user, me = doc usuarios + uid
    const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const DIAS_LARGO = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

    // ════════════════════════════════════════════════════════════════
    //  Utilidades
    // ════════════════════════════════════════════════════════════════
    const $ = (sel, ctx=document) => ctx.querySelector(sel);
    const app$ = () => document.getElementById('app');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials = (name, email) => {
      const src = (name || email || '?').trim();
      const parts = src.split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return src.slice(0,2).toUpperCase();
    };

    function toast(msg, type='') {
      const w = document.getElementById('toast-wrap');
      const t = document.createElement('div');
      t.className = 'toast ' + (type || '');
      t.innerHTML = `<span>${type==='ok'?'✅':type==='err'?'⚠️':'ℹ️'}</span><span>${esc(msg)}</span>`;
      w.appendChild(t);
      setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(8px)'; t.style.transition='all .25s'; setTimeout(()=>t.remove(), 260); }, 3600);
    }

    // ── Fechas (en zona horaria de referencia, no la del dispositivo) ──
    function hoyStr() { return fechaAStr(new Date()); }
    function fechaAStr(d) {
      // YYYY-MM-DD del instante d, evaluado en la zona TZ.
      const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
      const o = {}; p.forEach(x => o[x.type] = x.value);
      return `${o.year}-${o.month}-${o.day}`;
    }
    function weekdayDe(fechaStr) {
      // Día de la semana (0=Dom..6=Sáb) de una fecha YYYY-MM-DD.
      const [y,m,d] = fechaStr.split('-').map(Number);
      return new Date(Date.UTC(y, m-1, d)).getUTCDay();
    }
    function fechaLarga(fechaStr) {
      const [y,m,d] = fechaStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m-1, d, 12));
      return new Intl.DateTimeFormat('es-UY', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC' }).format(dt);
    }
    function fechaCorta(fechaStr) {
      const [y,m,d] = fechaStr.split('-').map(Number);
      return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
    }
    function sumarDias(fechaStr, n) {
      const [y,m,d] = fechaStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m-1, d)); dt.setUTCDate(dt.getUTCDate()+n);
      return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
    }
    function fmtHora(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : ts;
      return new Intl.DateTimeFormat('es-UY', { timeZone: TZ, hour:'2-digit', minute:'2-digit', hour12:false }).format(d);
    }
    function horaAhora() {
      return new Intl.DateTimeFormat('es-UY', { timeZone: TZ, hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    }

    // ════════════════════════════════════════════════════════════════
    //  Modelo de fichaje
    // ════════════════════════════════════════════════════════════════
    const fichajeId = (uid, fecha) => `${uid}_${fecha}`;

    // Estado de la jornada de un encuestador en una fecha.
    // u: doc usuario | f: doc fichaje | esLibre: bool | fecha: str
    function estadoJornada(u, f, esLibre, fecha) {
      if (!u.activo) return 'inactivo';
      if (esLibre) return 'dia_libre';
      const trabaja = (u.diasSemana || []).includes(weekdayDe(fecha));
      if (!trabaja) return 'no_correspondia';
      if (!f || !f.entrada) return 'no_ficho';
      if (f.entrada && !f.salida) {
        // Si es hoy y todavía no venció la hora de fin, está "en curso".
        if (fecha === hoyStr() && u.horaFin && horaAhora() < u.horaFin) return 'en_curso';
        return 'sin_salida';
      }
      return 'completa';
    }
    const ESTADO_LABEL = {
      completa:'Completa', no_ficho:'No fichó', sin_salida:'Sin salida', dia_libre:'Día libre',
      no_correspondia:'No corresponde', inactivo:'Inactivo', en_curso:'En curso'
    };
    const esIncompleto = (est) => est === 'no_ficho' || est === 'sin_salida';

    // ════════════════════════════════════════════════════════════════
    //  Acceso a datos
    // ════════════════════════════════════════════════════════════════
    async function getUsuarios() {
      const qs = await getDocs(collection(db, 'usuarios'));
      return qs.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a,b) => (a.nombre||'').localeCompare(b.nombre||''));
    }
    async function getFichajesDe(fecha) {
      const qs = await getDocs(query(collection(db,'fichajes'), where('fecha','==',fecha)));
      const m = {}; qs.docs.forEach(d => { m[d.data().uid] = d.data(); }); return m;
    }
    async function getLibresDe(fecha) {
      const qs = await getDocs(query(collection(db,'diasLibres'), where('fecha','==',fecha)));
      const s = new Set(); qs.docs.forEach(d => s.add(d.data().uid)); return s;
    }

    // ════════════════════════════════════════════════════════════════
    //  Arranque / Auth
    // ════════════════════════════════════════════════════════════════
    function boot() {
      if (!CONFIG_OK) { renderConfigFaltante(); return; }
      try {
        app = initializeApp(cfg);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch (e) {
        console.error(e); renderError('No se pudo iniciar Firebase: ' + e.message); return;
      }
      onAuthStateChanged(auth, async (user) => {
        S.user = user;
        if (!user) { S.me = null; renderLogin(); return; }
        app$().innerHTML = `<div class="center-screen"><div class="spinner"></div></div>`;
        try {
          const snap = await getDoc(doc(db, 'usuarios', user.uid));
          if (!snap.exists()) { renderSinAcceso(); return; }
          S.me = { uid: user.uid, ...snap.data() };
          if (S.me.rol === 'coordinadora') renderCoordinadora();
          else renderEncuestador();
        } catch (e) {
          console.error(e); renderError('No se pudieron cargar tus datos: ' + e.message);
        }
      });
    }

    async function doLogin() {
      const email = $('#login-email').value.trim();
      const pass = $('#login-pass').value;
      const alertBox = $('#login-alert');
      alertBox.className = 'hidden';
      if (!email || !pass) { showLoginAlert('Ingresá email y contraseña.'); return; }
      const btn = $('#login-btn'); btn.disabled = true; btn.textContent = 'Ingresando…';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        showLoginAlert(mensajeAuth(e));
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    }
    function showLoginAlert(msg) {
      const a = $('#login-alert'); a.className = 'alert alert-error'; a.textContent = msg;
    }
    function mensajeAuth(e) {
      const c = e.code || '';
      if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Email o contraseña incorrectos.';
      if (c.includes('too-many-requests')) return 'Demasiados intentos. Probá de nuevo en unos minutos.';
      if (c.includes('invalid-email')) return 'El email no es válido.';
      if (c.includes('email-already-in-use')) return 'Ya existe una cuenta con ese email.';
      if (c.includes('weak-password')) return 'La contraseña debe tener al menos 6 caracteres.';
      return e.message || 'Ocurrió un error.';
    }
    async function forgotPassword() {
      const email = ($('#login-email').value || '').trim();
      if (!email) { showLoginAlert('Escribí tu email arriba y volvé a tocar el enlace.'); return; }
      try { await sendPasswordResetEmail(auth, email); toast('Te enviamos un correo para restablecer la contraseña.', 'ok'); }
      catch (e) { showLoginAlert(mensajeAuth(e)); }
    }
    async function logout() { try { await signOut(auth); } catch(e){} }

    // ════════════════════════════════════════════════════════════════
    //  Pantallas de estado
    // ════════════════════════════════════════════════════════════════
    function renderConfigFaltante() {
      app$().innerHTML = `<div class="center-screen"><div class="info-card">
        <div class="ic-icon">⚙️</div>
        <h2>Falta configurar Firebase</h2>
        <p>Editá <strong>public/index.html</strong> y reemplazá el objeto <code>window.firebaseConfig</code> con las credenciales de tu proyecto. Encontrá el instructivo en el <strong>README.md</strong>.</p>
      </div></div>`;
    }
    function renderError(msg) {
      app$().innerHTML = `<div class="center-screen"><div class="info-card">
        <div class="ic-icon">⚠️</div><h2>Algo salió mal</h2><p>${esc(msg)}</p>
        <button class="btn btn-outline" onclick="location.reload()">Reintentar</button>
      </div></div>`;
    }
    function renderSinAcceso() {
      app$().innerHTML = `<div class="center-screen"><div class="info-card">
        <div class="ic-icon">🔒</div>
        <h2>Tu cuenta aún no fue habilitada</h2>
        <p>Iniciaste sesión correctamente, pero todavía no estás dado de alta en el sistema. Pedile a tu coordinadora que te agregue.</p>
        <button class="btn btn-dark btn-full" id="sa-logout">Cerrar sesión</button>
      </div></div>`;
      $('#sa-logout').onclick = logout;
    }

          <div class="greet">Hola, ${esc((nombre||'').split(' ')[0])}</div>
          <div class="today-date" id="enc-fecha">${esc(fechaLarga(hoyStr()))}</div>
          <div class="clock-live mono" id="enc-clock">--:--</div>
          <div id="enc-status"><div class="spinner"></div></div>
          <div class="big-actions">
            <button class="big-btn big-btn-in" id="btn-entrada" disabled><span class="bi">🟢</span>Fichar entrada</button>
            <button class="big-btn big-btn-out" id="btn-salida" disabled><span class="bi">🔴</span>Fichar salida</button>
          </div>
          <div class="ficha-note">La hora registrada es la del servidor. Se admite una entrada y una salida por día.</div>
        </div>
        <div class="card" style="margin-top:1.5rem;">
          <div class="card-header"><span class="card-header-title">Mis últimos días</span></div>
          <div class="card-body tight"><div class="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr></thead>
            <tbody id="enc-hist"><tr><td colspan="4"><div class="spinner"></div></td></tr></tbody>
          </table></div></div>
        </div>
      </div>`;
      $('#enc-logout').onclick = logout;
      if (_clockTimer) clearInterval(_clockTimer);
      const tick = () => { const c = $('#enc-clock'); if (c) c.textContent = new Intl.DateTimeFormat('es-UY',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()); };
      tick(); _clockTimer = setInterval(tick, 1000);
      await refrescarFichajeHoy();
      cargarHistorialEncuestador();
    }

    async function refrescarFichajeHoy() {
      const hoy = hoyStr();
      const ref = doc(db, 'fichajes', fichajeId(S.me.uid, hoy));
      let f = null;
      try { const s = await getDoc(ref); if (s.exists()) f = s.data(); } catch(e){ console.error(e); }
      const box = $('#enc-status'); const bIn = $('#btn-entrada'); const bOut = $('#btn-salida');
      if (!box) return;
      const trabajaHoy = (S.me.diasSemana||[]).includes(weekdayDe(hoy));
      if (!f || !f.entrada) {
        box.innerHTML = `<div class="status-line">Todavía no fichaste hoy.${trabajaHoy ? '' : ' <span class="est est-no_correspondia">Hoy no es día laboral</span>'}</div>`;
        bIn.disabled = false; bOut.disabled = true;
      } else if (!f.salida) {
        box.innerHTML = `<div class="status-line">Entrada registrada a las <strong>${fmtHora(f.entrada)}</strong>. Tu jornada está en curso.</div>`;
        bIn.disabled = true; bOut.disabled = false;
      } else {
        box.innerHTML = `<div class="status-line">✅ Jornada completa · Entrada <strong>${fmtHora(f.entrada)}</strong> · Salida <strong>${fmtHora(f.salida)}</strong></div>`;
        bIn.disabled = true; bOut.disabled = true;
      }
      bIn.onclick = ficharEntrada; bOut.onclick = ficharSalida;
    }

    async function ficharEntrada() {
      const bIn = $('#btn-entrada'); bIn.disabled = true;
      const hoy = hoyStr();
      const ref = doc(db, 'fichajes', fichajeId(S.me.uid, hoy));
      try {
        const s = await getDoc(ref);
        if (s.exists() && s.data().entrada) { toast('Ya tenías una entrada registrada hoy.', ''); await refrescarFichajeHoy(); cargarHistorialEncuestador(); return; }
        await setDoc(ref, {
          uid: S.me.uid, email: S.user.email, nombre: S.me.nombre || S.user.email,
          fecha: hoy, entrada: serverTimestamp(), salida: null, corregido: false, updatedAt: serverTimestamp()
        });
        toast('Entrada registrada. ¡Buena jornada!', 'ok');
      } catch (e) { console.error(e); toast('No se pudo registrar la entrada: ' + e.message, 'err'); }
      await refrescarFichajeHoy(); cargarHistorialEncuestador();
    }
    async function ficharSalida() {
      const bOut = $('#btn-salida'); bOut.disabled = true;
      const hoy = hoyStr();
      const ref = doc(db, 'fichajes', fichajeId(S.me.uid, hoy));
      try {
        const s = await getDoc(ref);
        if (!s.exists() || !s.data().entrada) { toast('Primero tenés que fichar la entrada.', 'err'); await refrescarFichajeHoy(); return; }
        if (s.data().salida) { toast('Ya tenías una salida registrada hoy.', ''); await refrescarFichajeHoy(); return; }
        await updateDoc(ref, { salida: serverTimestamp(), updatedAt: serverTimestamp() });
        toast('Salida registrada. ¡Hasta mañana!', 'ok');
      } catch (e) { console.error(e); toast('No se pudo registrar la salida: ' + e.message, 'err'); }
      await refrescarFichajeHoy(); cargarHistorialEncuestador();
    }

    async function cargarHistorialEncuestador() {
      const tb = $('#enc-hist'); if (!tb) return;
      const desde = sumarDias(hoyStr(), -13);
      try {
        // Mis días libres (para no marcarlos como ausencia en mi historial).
        let libres = new Set();
        try {
          const lqs = await getDocs(query(collection(db,'diasLibres'), where('uid','==',S.me.uid)));
          lqs.docs.forEach(d => libres.add(d.data().fecha));
        } catch(e){ /* opcional */ }
        const qs = await getDocs(query(collection(db,'fichajes'),
          where('uid','==',S.me.uid), where('fecha','>=',desde), orderBy('fecha','desc')));
        const rows = qs.docs.map(d => d.data());
        if (!rows.length) { tb.innerHTML = `<tr><td colspan="4"><div class="empty-state">Todavía no tenés fichajes registrados.</div></td></tr>`; return; }
        tb.innerHTML = rows.map(f => {
          const est = estadoJornada(S.me, f, libres.has(f.fecha), f.fecha);
          return `<tr>
            <td class="td-strong">${esc(fechaCorta(f.fecha))} <span class="td-muted" style="font-weight:500;">${esc(DIAS[weekdayDe(f.fecha)])}</span></td>
            <td class="mono">${fmtHora(f.entrada)}</td>
            <td class="mono">${fmtHora(f.salida)}</td>
            <td><span class="est est-${est}">${ESTADO_LABEL[est]}</span></td>
          </tr>`;
        }).join('');
      } catch (e) { console.error(e); tb.innerHTML = `<tr><td colspan="4"><div class="empty-state">No se pudo cargar el historial.</div></td></tr>`; }
    }

    function irA(id) {
      _page = id;
      $('#nav').querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === id));
      abrirPagina(id);
    }
    function abrirPagina(id) {
      const m = $('#main'); if (!m) return;
      m.innerHTML = `<div class="center-screen" style="min-height:40vh"><div class="spinner"></div></div>`;
      ({ panel:pagPanel, encuestadores:pagEncuestadores, libres:pagLibres, cierre:pagCierre, exportar:pagExportar, config:pagConfig }[id] || pagPanel)();
    }
    function pageHeader(titulo, acento, sub) {
      return `<div class="page-header"><div class="accent-bar"></div>
        <div class="header-row"><div><h2>${esc(titulo)} <span class="accent">${esc(acento||'')}</span></h2><p>${esc(sub||'')}</p></div><div id="ph-actions"></div></div></div>`;
    }

    // ── PANEL DEL DÍA ─────────────────────────────────────────────
    let _panelFecha = null;
    async function pagPanel() {
      if (!_panelFecha) _panelFecha = hoyStr();
      const m = $('#main');
      m.innerHTML = pageHeader('Panel', 'del día', 'Quién fichó, a qué hora y quién quedó con la jornada incompleta.') +
        `<div class="card"><div class="card-header">
            <div class="date-nav">
              <button class="btn btn-outline btn-sm" id="p-prev">‹</button>
              <span class="cur" id="p-cur"></span>
              <button class="btn btn-outline btn-sm" id="p-next">›</button>
              <button class="btn btn-outline btn-sm" id="p-hoy">Hoy</button>
            </div>
            <input type="date" id="p-date" class="fselect" style="width:auto;" />
          </div><div class="card-body tight"><div id="panel-body"><div class="spinner"></div></div></div></div>`;
      $('#p-prev').onclick = () => { _panelFecha = sumarDias(_panelFecha,-1); cargarPanel(); };
      $('#p-next').onclick = () => { _panelFecha = sumarDias(_panelFecha, 1); cargarPanel(); };
      $('#p-hoy').onclick  = () => { _panelFecha = hoyStr(); cargarPanel(); };
      $('#p-date').onchange = (e) => { if (e.target.value) { _panelFecha = e.target.value; cargarPanel(); } };
      cargarPanel();
    }
    async function cargarPanel() {
      $('#p-cur').textContent = fechaLarga(_panelFecha);
      $('#p-date').value = _panelFecha;
      const body = $('#panel-body'); body.innerHTML = `<div style="padding:2rem"><div class="spinner"></div></div>`;
      try {
        const [usuarios, fichajes, libres] = await Promise.all([getUsuarios(), getFichajesDe(_panelFecha), getLibresDe(_panelFecha)]);
        const activos = usuarios.filter(u => u.activo && u.rol === 'encuestador');
        const rows = activos.map(u => {
          const f = fichajes[u.uid];
          const est = estadoJornada(u, f, libres.has(u.uid), _panelFecha);
          return { u, f, est };
        });
        // Contadores
        const c = { total:rows.length, completa:0, incompleta:0, dia_libre:0, no_correspondia:0 };
        rows.forEach(r => {
          if (r.est==='completa') c.completa++;
          else if (esIncompleto(r.est)) c.incompleta++;
          else if (r.est==='dia_libre') c.dia_libre++;
          else if (r.est==='no_correspondia') c.no_correspondia++;
        });
        // Orden: incompletos primero
        const peso = { no_ficho:0, sin_salida:1, en_curso:2, completa:3, dia_libre:4, no_correspondia:5, inactivo:6 };
        rows.sort((a,b) => (peso[a.est]-peso[b.est]) || (a.u.nombre||'').localeCompare(b.u.nombre||''));
        const stats = `<div class="stat-grid" style="padding:1.25rem 1.25rem 0;">
          <div class="stat s-total"><div class="stat-num">${c.total}</div><div class="stat-label">Encuestadores</div></div>
          <div class="stat s-ok"><div class="stat-num">${c.completa}</div><div class="stat-label">Completas</div></div>
          <div class="stat s-bad"><div class="stat-num">${c.incompleta}</div><div class="stat-label">Incompletas</div></div>
          <div class="stat s-free"><div class="stat-num">${c.dia_libre}</div><div class="stat-label">Días libres</div></div>
          <div class="stat s-warn"><div class="stat-num">${c.no_correspondia}</div><div class="stat-label">No corresponde</div></div>
        </div>`;
        if (!rows.length) { body.innerHTML = stats + `<div class="empty-state"><span class="ei">👥</span>No hay encuestadores activos para mostrar.</div>`; return; }
        const tabla = `<div class="table-wrap"><table>
          <thead><tr><th>Encuestador</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td><div style="display:flex;align-items:center;gap:.6rem;"><div class="user-avatar" style="width:30px;height:30px;font-size:.72rem;background:${esIncompleto(r.est)?'var(--red)':'var(--orange)'}">${esc(initials(r.u.nombre,r.u.email))}</div>
              <div><div class="td-strong">${esc(r.u.nombre||r.u.email)}</div><div class="td-muted" style="font-size:.72rem;">${esc(r.u.email)}</div></div></div></td>
            <td class="mono">${fmtHora(r.f && r.f.entrada)}</td>
            <td class="mono">${fmtHora(r.f && r.f.salida)}</td>
            <td><span class="est est-${r.est}">${ESTADO_LABEL[r.est]}</span></td>
          </tr>`).join('')}</tbody></table></div>`;
        body.innerHTML = stats + tabla;
      } catch (e) { console.error(e); body.innerHTML = `<div class="empty-state">No se pudo cargar el panel: ${esc(e.message)}</div>`; }
    }

    // ── ENCUESTADORES ─────────────────────────────────────────────
    async function pagEncuestadores() {
      const m = $('#main');
      m.innerHTML = pageHeader('Gestión de', 'usuarios', 'Alta y gestión de encuestadores y coordinadoras: estado (activo/inactivo) y horario de trabajo.') +
        `<div class="card"><div class="card-header"><span class="card-header-title">Lista de usuarios</span>
          <button class="btn btn-orange btn-sm" id="nuevo-enc">＋ Nuevo usuario</button></div>
          <div class="card-body tight"><div id="enc-tabla"><div style="padding:2rem"><div class="spinner"></div></div></div></div></div>`;

      cargarTablaEncuestadores();
    }
    async function cargarTablaEncuestadores() {
      const cont = $('#enc-tabla');
      try {
        const usuarios = await getUsuarios();
        if (!usuarios.length) { cont.innerHTML = `<div class="empty-state"><span class="ei">👥</span>Todavía no hay usuarios. Creá el primero con “Nuevo usuario”.</div>`; return; }
        cont.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Días</th><th>Hora fin</th><th>Acciones</th></tr></thead>
          <tbody>${usuarios.map(u => {
            const dias = (u.diasSemana||[]).slice().sort().map(d=>DIAS[d]).join(' · ') || '—';
            return `<tr>
              <td><div class="td-strong">${esc(u.nombre||'—')}</div><div class="td-muted" style="font-size:.72rem;">${esc(u.email)}</div></td>
              <td>${u.rol==='coordinadora' ? '<span class="badge badge-admin">Coordinadora</span>' : '<span class="badge badge-user">Encuestador</span>'}</td>
              <td>${u.activo ? '<span class="badge badge-on">Activo</span>' : '<span class="badge badge-off">Inactivo</span>'}</td>
              <td class="td-muted nowrap" style="font-size:.76rem;">${esc(dias)}</td>
              <td class="mono">${esc(u.horaFin||'—')}</td>
              <td><div class="td-actions">
                <button class="btn btn-outline btn-sm" data-edit="${u.uid}">Editar</button>
                <button class="btn btn-outline btn-sm" data-toggle="${u.uid}">${u.activo?'Desactivar':'Activar'}</button>
                <button class="btn btn-outline btn-sm" data-pass="${esc(u.email)}">Reset clave</button>
              </div></td></tr>`;
          }).join('')}</tbody></table></div>`;
        const usuariosById = Object.fromEntries(usuarios.map(u=>[u.uid,u]));
        cont.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => modalUsuario(usuariosById[b.dataset.edit]));
        cont.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleActivo(usuariosById[b.dataset.toggle]));
        cont.querySelectorAll('[data-pass]').forEach(b => b.onclick = () => resetClave(b.dataset.pass));
      } catch (e) { console.error(e); cont.innerHTML = `<div class="empty-state">No se pudo cargar la nómina: ${esc(e.message)}</div>`; }

    async function toggleActivo(u) {
      try { await updateDoc(doc(db,'usuarios',u.uid), { activo: !u.activo }); toast(`${u.nombre||u.email} quedó ${!u.activo?'activo':'inactivo'}.`, 'ok'); cargarTablaEncuestadores(); }
      catch (e) { toast('No se pudo actualizar: ' + e.message, 'err'); }
    }
    async function resetClave(email) {
      try { await sendPasswordResetEmail(auth, email); toast(`Enviamos un correo de restablecimiento a ${email}.`, 'ok'); }
      catch (e) { toast('No se pudo enviar: ' + mensajeAuth(e), 'err'); }
    }

    function diasSelectorHTML(sel) {
      return `<div class="seg" id="dias-seg">${DIAS.map((d,i) =>
        `<label><input type="checkbox" value="${i}" ${sel.includes(i)?'checked':''}/><span>${d}</span></label>`).join('')}</div>`;
    }
    function modalUsuario(u) {
      const esNuevo = !u;
      const sel = u ? (u.diasSemana||[]) : [1,2,3,4,5];
      openModal({
        title: esNuevo ? 'Nuevo usuario' : 'Editar usuario',
        body: `
          <div id="mu-alert" class="hidden"></div>
          <div class="form-group"><label>Nombre y apellido</label><input type="text" id="mu-nombre" value="${esc(u?.nombre||'')}" placeholder="Ej. María Pérez" /></div>
          <div class="form-group"><label>Email</label><input type="email" id="mu-email" value="${esc(u?.email||'')}" placeholder="usuario@equipos.com.uy" ${esNuevo?'':'disabled'} />${esNuevo?'':'<div class="field-hint">El email no se puede modificar.</div>'}</div>
          ${esNuevo ? `<div class="form-group"><label>Contraseña inicial</label><input type="text" id="mu-pass" value="" placeholder="Mínimo 6 caracteres" /><div class="field-hint">El usuario podrá cambiarla luego con “¿Olvidaste tu contraseña?”.</div></div>` : ''}
          <div class="form-row">
            <div class="form-group"><label>Rol</label><select class="fselect" id="mu-rol">
              <option value="encuestador" ${u?.rol!=='coordinadora'?'selected':''}>Encuestador</option>
              <option value="coordinadora" ${u?.rol==='coordinadora'?'selected':''}>Coordinadora</option></select></div>
            <div class="form-group"><label>Estado</label><select class="fselect" id="mu-activo">
              <option value="1" ${(!u||u.activo)?'selected':''}>Activo</option>
              <option value="0" ${(u&&!u.activo)?'selected':''}>Inactivo</option></select></div>
          </div>
          <div class="form-group"><label>Días que trabaja</label>${diasSelectorHTML(sel)}</div>
          <div class="form-group" style="max-width:180px;"><label>Hora de fin de jornada</label><input type="time" id="mu-horafin" value="${esc(u?.horaFin||'18:00')}" /><div class="field-hint">Referencia para evaluar la ausencia al cierre del día.</div></div>
        `,
        okLabel: esNuevo ? 'Crear usuario' : 'Guardar cambios',
        onOk: async (close, setBusy) => {
          const nombre = $('#mu-nombre').value.trim();
          const email = $('#mu-email').value.trim().toLowerCase();
          const rol = $('#mu-rol').value;
          const activo = $('#mu-activo').value === '1';
          const horaFin = $('#mu-horafin').value || '18:00';
          const dias = [...document.querySelectorAll('#dias-seg input:checked')].map(x => Number(x.value));
          const alertBox = $('#mu-alert');
          const err = (msg) => { alertBox.className='alert alert-error'; alertBox.textContent=msg; };
          if (!nombre) return err('Ingresá el nombre.');
          if (!email) return err('Ingresá el email.');
          if (rol === 'encuestador' && !dias.length) return err('Seleccioná al menos un día de trabajo.');
          setBusy(true);
          try {
            if (esNuevo) {
              const pass = $('#mu-pass').value;
              if (!pass || pass.length < 6) { setBusy(false); return err('La contraseña debe tener al menos 6 caracteres.'); }
              const uid = await crearAuthUser(email, pass);
              await setDoc(doc(db,'usuarios',uid), {
                email, nombre, rol, activo, diasSemana: dias, horaFin, createdAt: serverTimestamp()
              });
              toast('Usuario creado.', 'ok');
            } else {
              await updateDoc(doc(db,'usuarios',u.uid), { nombre, rol, activo, diasSemana: dias, horaFin });
              toast('Cambios guardados.', 'ok');
            }
            close(); cargarTablaEncuestadores();
          } catch (e) { console.error(e); setBusy(false); err(mensajeAuth(e)); }
        }
      });
    }
    // Crea el usuario de Auth usando una app SECUNDARIA para no cerrar la sesión de la coordinadora.
    async function crearAuthUser(email, pass) {
      const sec = initializeApp(cfg, 'secondary-' + Date.now());
      const secAuth = getAuth(sec);
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, email, pass);
        const uid = cred.user.uid;
        await signOut(secAuth);
        return uid;
      } finally { try { await deleteApp(sec); } catch(e){} }
    }

      const m = $('#main');
      m.innerHTML = pageHeader('Días', 'libres', 'Marcá días en los que uno o varios encuestadores no deben fichar (no cuentan como ausencia).') +

              <div class="form-group"><label>Desde</label><input type="date" id="dl-desde" value="${hoyStr()}" /></div>

          <input type="month" id="dl-mes" class="fselect" style="width:auto;" /></div>
          <div class="card-body tight"><div id="dl-lista"><div style="padding:2rem"><div class="spinner"></div></div></div></div></div>`;
      const usuarios = (await getUsuarios()).filter(u => u.rol === 'encuestador');
      $('#dl-picklist').innerHTML = usuarios.length ? usuarios.map(u => `
        <label class="pick"><input type="checkbox" value="${u.uid}" data-email="${esc(u.email)}" data-nombre="${esc(u.nombre||u.email)}"/>
          <div class="pick-avatar">${esc(initials(u.nombre,u.email))}</div>
          <div><div class="pick-name">${esc(u.nombre||u.email)}</div><div class="pick-email">${esc(u.email)}</div></div></label>`).join('')
        : `<div class="empty-state">No hay encuestadores.</div>`;
      $('#dl-all').onclick = () => document.querySelectorAll('#dl-picklist input').forEach(i=>i.checked=true);
      $('#dl-none').onclick = () => document.querySelectorAll('#dl-picklist input').forEach(i=>i.checked=false);
      $('#dl-guardar').onclick = guardarDiasLibres;
      const now = hoyStr().slice(0,7);
      $('#dl-mes').value = now; $('#dl-mes').onchange = () => cargarListaLibres($('#dl-mes').value);
      cargarListaLibres(now);
    }
    async function guardarDiasLibres() {
      const desde = $('#dl-desde').value, hasta = $('#dl-hasta').value;
      const motivo = $('#dl-motivo').value.trim();
      const sel = [...document.querySelectorAll('#dl-picklist input:checked')];
      if (!desde || !hasta) return toast('Elegí las fechas.', 'err');
      if (hasta < desde) return toast('La fecha “hasta” no puede ser anterior a “desde”.', 'err');
      if (!sel.length) return toast('Seleccioná al menos un encuestador.', 'err');
      const btn = $('#dl-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        const batch = writeBatch(db);
        let count = 0;
        for (let f = desde; f <= hasta; f = sumarDias(f,1)) {
          for (const el of sel) {
            const uid = el.value;
            batch.set(doc(db,'diasLibres', `${uid}_${f}`), {
              uid, email: el.dataset.email, nombre: el.dataset.nombre, fecha: f, motivo,
              createdBy: S.user.email, createdAt: serverTimestamp()
            });
            count++;
          }
        }
        await batch.commit();
        toast(`${count} día(s) libre(s) marcado(s).`, 'ok');
        document.querySelectorAll('#dl-picklist input').forEach(i=>i.checked=false);
        $('#dl-motivo').value = '';
        cargarListaLibres($('#dl-mes').value);
      } catch (e) { console.error(e); toast('No se pudo guardar: ' + e.message, 'err'); }
      btn.disabled = false; btn.textContent = 'Marcar día(s) libre(s)';
    }
    async function cargarListaLibres(mes) {
      const cont = $('#dl-lista');
      const desde = mes + '-01', hasta = mes + '-31';
      try {
        const qs = await getDocs(query(collection(db,'diasLibres'), where('fecha','>=',desde), where('fecha','<=',hasta), orderBy('fecha','asc')));
        const rows = qs.docs.map(d => ({ id:d.id, ...d.data() }));
        if (!rows.length) { cont.innerHTML = `<div class="empty-state"><span class="ei">🌴</span>No hay días libres en este mes.</div>`; return; }
        cont.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th>Fecha</th><th>Encuestador</th><th>Motivo</th><th></th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td class="td-strong nowrap">${esc(fechaCorta(r.fecha))} <span class="td-muted" style="font-weight:500">${esc(DIAS[weekdayDe(r.fecha)])}</span></td>
            <td>${esc(r.nombre||r.email)}</td>
            <td class="td-muted">${esc(r.motivo||'—')}</td>
            <td><button class="btn btn-outline btn-sm" data-del="${esc(r.id)}">Quitar</button></td>
          </tr>`).join('')}</tbody></table></div>`;
        cont.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
          try { await deleteDoc(doc(db,'diasLibres', b.dataset.del)); toast('Día libre quitado.', 'ok'); cargarListaLibres(mes); }
          catch (e) { toast('No se pudo quitar: ' + e.message, 'err'); }
        });
      } catch (e) { console.error(e); cont.innerHTML = `<div class="empty-state">No se pudo cargar: ${esc(e.message)}</div>`; }
    }

    // ── CIERRE DEL DÍA (R4 visualización + envío por correo) ───────
    let _cierreFecha = null;
    async function pagCierre() {
      if (!_cierreFecha) _cierreFecha = hoyStr();
      const m = $('#main');
      m.innerHTML = pageHeader('Cierre', 'del día', 'Encuestadores que no completaron su jornada. Lo mismo que se envía por correo al coordinador.') +
        `<div class="card"><div class="card-header">
            <input type="date" id="ci-date" class="fselect" style="width:auto;" value="${_cierreFecha}" />
            <div class="td-actions">
              <button class="btn btn-outline btn-sm" id="ci-copiar">Copiar resumen</button>
              <button class="btn btn-orange btn-sm" id="ci-enviar">Enviar por correo</button>
            </div>
          </div><div class="card-body tight"><div id="cierre-body"><div style="padding:2rem"><div class="spinner"></div></div></div></div></div>`;
      $('#ci-date').onchange = (e) => { if (e.target.value) { _cierreFecha = e.target.value; cargarCierre(); } };
      $('#ci-copiar').onclick = copiarCierre;
      $('#ci-enviar').onclick = enviarCierre;
      cargarCierre();
    }
    let _cierreCache = { fecha:null, incompletos:[] };
    async function calcularIncompletos(fecha) {
      const [usuarios, fichajes, libres] = await Promise.all([getUsuarios(), getFichajesDe(fecha), getLibresDe(fecha)]);
      const activos = usuarios.filter(u => u.activo && u.rol === 'encuestador');
      const out = [];
      for (const u of activos) {
        const f = fichajes[u.uid];
        const est = estadoJornada(u, f, libres.has(u.uid), fecha);
        if (esIncompleto(est)) out.push({ nombre: u.nombre||u.email, email: u.email, motivo: est==='no_ficho'?'No fichó':'Fichó entrada pero no salida', entrada: f&&f.entrada?fmtHora(f.entrada):'—' });
      }
      return out;
    }
    async function cargarCierre() {
      $('#ci-date').value = _cierreFecha;
      const body = $('#cierre-body'); body.innerHTML = `<div style="padding:2rem"><div class="spinner"></div></div>`;
      try {
        const inc = await calcularIncompletos(_cierreFecha);
        _cierreCache = { fecha:_cierreFecha, incompletos: inc };
        const esHoy = _cierreFecha === hoyStr();
        const aviso = esHoy ? `<div class="alert alert-info" style="margin:1.25rem 1.25rem 0;">Estás viendo <strong>hoy</strong>. Los encuestadores cuya jornada aún no venció figuran “en curso” y no se cuentan como incompletos.</div>` : '';
        if (!inc.length) {
          body.innerHTML = aviso + `<div class="empty-state"><span class="ei">✅</span>Sin jornadas incompletas para el ${esc(fechaCorta(_cierreFecha))}. ¡Todo en orden!</div>`;
          return;
        }
        body.innerHTML = aviso + `<div style="padding:1.25rem 1.25rem 0;"><div class="alert alert-warn"><strong>${inc.length}</strong> encuestador(es) con jornada incompleta el ${esc(fechaCorta(_cierreFecha))}.</div></div>
          <div class="table-wrap"><table>
            <thead><tr><th>Encuestador</th><th>Situación</th><th>Entrada</th></tr></thead>
            <tbody>${inc.map(r => `<tr>
              <td><div class="td-strong">${esc(r.nombre)}</div><div class="td-muted" style="font-size:.72rem;">${esc(r.email)}</div></td>
              <td><span class="est ${r.motivo==='No fichó'?'est-no_ficho':'est-sin_salida'}">${esc(r.motivo)}</span></td>
              <td class="mono">${esc(r.entrada)}</td>
            </tr>`).join('')}</tbody></table></div>`;
      } catch (e) { console.error(e); body.innerHTML = `<div class="empty-state">No se pudo calcular: ${esc(e.message)}</div>`; }
    }
    function textoCierre(fecha, inc) {
      let t = `Cierre del día — ${fechaCorta(fecha)}\n\n`;
      if (!inc.length) return t + 'Sin jornadas incompletas. Todos los encuestadores activos cumplieron.';
      t += `Encuestadores con jornada incompleta (${inc.length}):\n`;
      inc.forEach(r => { t += `• ${r.nombre} (${r.email}) — ${r.motivo}${r.motivo!=='No fichó'?` · entrada ${r.entrada}`:''}\n`; });
      return t;
    }
    async function copiarCierre() {
      if (_cierreCache.fecha !== _cierreFecha) await cargarCierre();
      const t = textoCierre(_cierreFecha, _cierreCache.incompletos);
      try { await navigator.clipboard.writeText(t); toast('Resumen copiado al portapapeles.', 'ok'); }
      catch (e) { toast('No se pudo copiar automáticamente.', 'err'); }
    }
    async function enviarCierre() {
      if (_cierreCache.fecha !== _cierreFecha) await cargarCierre();
      const inc = _cierreCache.incompletos;
      // Destinatarios: config/notificaciones o, en su defecto, todas las coordinadoras.
      let destinatarios = [];
      try {
        const cs = await getDoc(doc(db,'config','notificaciones'));
        if (cs.exists() && Array.isArray(cs.data().destinatarios)) destinatarios = cs.data().destinatarios.filter(Boolean);
      } catch(e){}
      if (!destinatarios.length) {
        const coords = (await getUsuarios()).filter(u => u.rol==='coordinadora').map(u=>u.email);
        destinatarios = coords;
      }
      if (!destinatarios.length) return toast('No hay destinatarios configurados (ver Notificaciones).', 'err');
      if (!inc.length && !confirm('No hay jornadas incompletas. ¿Enviar igual un correo de “todo en orden”?')) return;
      const btn = $('#ci-enviar'); btn.disabled = true; btn.textContent = 'Enviando…';
      const filas = inc.map(r => `<tr><td style="padding:8px 12px;border-bottom:1px solid #eee;font-weight:600;">${esc(r.nombre)}<br><span style="color:#888;font-size:12px;">${esc(r.email)}</span></td><td style="padding:8px 12px;border-bottom:1px solid #eee;">${esc(r.motivo)}</td><td style="padding:8px 12px;border-bottom:1px solid #eee;">${esc(r.entrada)}</td></tr>`).join('');
      const html = `<div style="font-family:Arial,sans-serif;color:#333;max-width:640px;">
        <div style="background:#3A3838;padding:20px 24px;"><span style="color:#E96436;font-weight:800;font-size:18px;">Equipos Consultores</span><span style="color:#fff;font-weight:600;"> · Fichaje de encuestadores</span></div>
        <div style="padding:24px;"><h2 style="color:#3A3838;margin:0 0 4px;">Cierre del día — ${esc(fechaCorta(_cierreFecha))}</h2>
        ${inc.length ? `<p style="color:#B83A26;font-weight:700;">${inc.length} encuestador(es) con jornada incompleta:</p>
          <table style="border-collapse:collapse;width:100%;font-size:14px;"><thead><tr><th style="text-align:left;padding:8px 12px;background:#f7f7f7;">Encuestador</th><th style="text-align:left;padding:8px 12px;background:#f7f7f7;">Situación</th><th style="text-align:left;padding:8px 12px;background:#f7f7f7;">Entrada</th></tr></thead><tbody>${filas}</tbody></table>`
          : `<p style="color:#1E9E57;font-weight:700;">Sin jornadas incompletas. Todos los encuestadores activos cumplieron. ✅</p>`}
        <p style="color:#999;font-size:12px;margin-top:24px;">Mensaje automático del sistema de fichaje.</p></div></div>`;
      try {
        await setDoc(doc(collection(db, MAIL_COLLECTION)), {
          to: destinatarios,
          message: { subject: `Cierre del día ${fechaCorta(_cierreFecha)} — ${inc.length? inc.length+' incompleto(s)':'todo en orden'}`, html, text: textoCierre(_cierreFecha, inc) }
        });
        toast('Correo encolado para envío.', 'ok');
      } catch (e) { console.error(e); toast('No se pudo encolar el correo: ' + e.message, 'err'); }
      btn.disabled = false; btn.textContent = 'Enviar por correo';
    }

    // ── EXPORTAR A EXCEL (R6) ─────────────────────────────────────
    async function pagExportar() {
      const m = $('#main');
      const hace30 = sumarDias(hoyStr(), -29);
      m.innerHTML = pageHeader('Exportar', 'a Excel', 'Descargá los registros de un rango de fechas en formato .xlsx.') +
        `<div class="card"><div class="card-body">
          <div class="form-row">
            <div class="form-group"><label>Desde</label><input type="date" id="ex-desde" value="${hace30}" /></div>
            <div class="form-group"><label>Hasta</label><input type="date" id="ex-hasta" value="${hoyStr()}" /></div>
          </div>
          <div class="alert alert-info">El archivo incluye, por encuestador y por día: fecha, nombre, email, entrada, salida y estado (completa / no fichó / sin salida / día libre / no corresponde).</div>
          <button class="btn btn-orange" id="ex-btn">⬇ Descargar Excel</button>
          <div id="ex-status" style="margin-top:1rem;"></div>
        </div></div>`;
      $('#ex-btn').onclick = exportarExcel;
    }
    async function exportarExcel() {
      const desde = $('#ex-desde').value, hasta = $('#ex-hasta').value;
      const st = $('#ex-status');
      if (!desde || !hasta) { st.innerHTML = `<div class="alert alert-error">Elegí las fechas.</div>`; return; }
      if (hasta < desde) { st.innerHTML = `<div class="alert alert-error">El “hasta” no puede ser anterior al “desde”.</div>`; return; }
      if (typeof XLSX === 'undefined') { st.innerHTML = `<div class="alert alert-error">No se pudo cargar la librería de Excel (revisá tu conexión).</div>`; return; }
      const btn = $('#ex-btn'); btn.disabled = true; btn.textContent = 'Generando…';
      st.innerHTML = `<div class="spinner"></div>`;
      try {
        const usuarios = (await getUsuarios()).filter(u => u.rol === 'encuestador');
        // Fichajes y libres del rango.
        const [fqs, lqs] = await Promise.all([
          getDocs(query(collection(db,'fichajes'), where('fecha','>=',desde), where('fecha','<=',hasta))),
          getDocs(query(collection(db,'diasLibres'), where('fecha','>=',desde), where('fecha','<=',hasta)))
        ]);
        const fMap = {}; fqs.docs.forEach(d => { const x=d.data(); fMap[`${x.uid}_${x.fecha}`]=x; });
        const lSet = new Set(); lqs.docs.forEach(d => { const x=d.data(); lSet.add(`${x.uid}_${x.fecha}`); });
        const rows = [['Fecha','Día','Nombre','Email','Entrada','Salida','Estado']];
        let n = 0;
        for (let f = desde; f <= hasta; f = sumarDias(f,1)) {
          for (const u of usuarios) {
            const fich = fMap[`${u.uid}_${f}`];
            const est = estadoJornada(u, fich, lSet.has(`${u.uid}_${f}`), f);
            if (est === 'no_correspondia' && !fich) continue; // no ensuciar el export con días no laborales sin fichaje
            rows.push([ fechaCorta(f), DIAS[weekdayDe(f)], u.nombre||'', u.email,
              fich&&fich.entrada?fmtHora(fich.entrada):'', fich&&fich.salida?fmtHora(fich.salida):'', ESTADO_LABEL[est] ]);
            n++;
          }
        }
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{wch:11},{wch:6},{wch:24},{wch:28},{wch:9},{wch:9},{wch:16}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Fichajes');
        XLSX.writeFile(wb, `fichajes_${desde}_a_${hasta}.xlsx`);
        st.innerHTML = `<div class="alert alert-success">Listo: ${n} registro(s) exportado(s).</div>`;
      } catch (e) { console.error(e); st.innerHTML = `<div class="alert alert-error">No se pudo exportar: ${esc(e.message)}</div>`; }
      btn.disabled = false; btn.textContent = '⬇ Descargar Excel';
    }

    // ── NOTIFICACIONES (destinatarios del correo de cierre) ───────
    async function pagConfig() {
      const m = $('#main');
      let dest = [];
      try { const s = await getDoc(doc(db,'config','notificaciones')); if (s.exists() && Array.isArray(s.data().destinatarios)) dest = s.data().destinatarios; } catch(e){}
      m.innerHTML = pageHeader('Notificaciones', 'por correo', 'Quién recibe el correo de cierre del día con las jornadas incompletas.') +
        `<div class="card"><div class="card-body">
          <div class="form-group"><label>Destinatarios (uno por línea)</label>
            <textarea class="finput" id="cf-dest" placeholder="coordinacion@equipos.com.uy">${esc(dest.join('\n'))}</textarea>
            <div class="field-hint">Si lo dejás vacío, el correo se envía a todas las coordinadoras dadas de alta.</div></div>
          <button class="btn btn-orange" id="cf-guardar">Guardar destinatarios</button>
        </div></div>
        <div class="card"><div class="card-header"><span class="card-header-title">Cómo se envía el correo</span></div>
          <div class="card-body">
            <div class="alert alert-info" style="margin-bottom:0;">El envío efectivo lo hace la extensión <strong>Trigger Email from Firestore</strong> (la app deja el mensaje en la colección <code>${esc(MAIL_COLLECTION)}</code>). El correo automático de cierre a las 23:59 lo dispara la Cloud Function <code>cierreDelDia</code>. Ver <strong>README.md</strong> para la instalación.</div>
          </div></div>`;
      $('#cf-guardar').onclick = async () => {
        const lista = $('#cf-dest').value.split(/[\n,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
        try { await setDoc(doc(db,'config','notificaciones'), { destinatarios: lista, updatedAt: serverTimestamp(), updatedBy: S.user.email }, {merge:true}); toast('Destinatarios guardados.', 'ok'); }
        catch (e) { toast('No se pudo guardar: ' + e.message, 'err'); }
      };
    }

    // ════════════════════════════════════════════════════════════════
    //  Modal genérico
    // ════════════════════════════════════════════════════════════════
    function openModal({ title, body, okLabel, onOk }) {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `<div class="modal-box"><div class="modal-head"><div class="modal-title">${esc(title)}</div><button class="modal-close">×</button></div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot"><button class="btn btn-outline" data-cancel>Cancelar</button><button class="btn btn-orange" data-ok>${esc(okLabel||'Guardar')}</button></div></div>`;
      document.body.appendChild(back);
      const close = () => back.remove();
      const setBusy = (b) => { const ok = back.querySelector('[data-ok]'); ok.disabled = b; ok.textContent = b ? 'Guardando…' : (okLabel||'Guardar'); };
      back.querySelector('.modal-close').onclick = close;
      back.querySelector('[data-cancel]').onclick = close;
      back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
      back.querySelector('[data-ok]').onclick = () => onOk(close, setBusy);
    }

    // ════════════════════════════════════════════════════════════════
    boot();
  </script>
</body>
</html>
